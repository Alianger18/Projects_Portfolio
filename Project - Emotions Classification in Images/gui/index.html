<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotion Classifier</title>
    <meta name="description" content="Upload a facial image to detect emotions using deep learning." />

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet" />

    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

    <!-- Animated background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="app-container">

        <!-- ============ HEADER ============ -->
        <header class="app-header">
            <div class="logo-icon">🎭</div>
            <h1>Emotion Classifier</h1>
            <p class="subtitle">Upload a facial image and let AI detect the emotion</p>
            <div id="demoBadge" class="demo-badge" style="display: none;">Demo Mode — Simulation</div>
        </header>

        <!-- ============ UPLOAD ZONE ============ -->
        <div class="upload-card" id="uploadCard">
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="drop-text">Drag &amp; drop an image here</p>
                    <p class="drop-subtext">or click to browse files</p>
                    <span class="file-types">Supports JPG, PNG, WEBP</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" hidden />
            </div>
        </div>

        <!-- ============ RESULTS SECTION ============ -->
        <div class="results-container" id="resultsContainer">

            <!-- Preview -->
            <div class="preview-card">
                <img id="previewImage" alt="Uploaded image preview" />
            </div>

            <!-- Prediction results -->
            <div class="prediction-card">

                <!-- Loading state -->
                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <p>Analyzing expression...</p>
                </div>

                <!-- Results -->
                <div class="results-content" id="resultsContent">
                    <!-- Top prediction -->
                    <div class="top-prediction" id="topPrediction">
                        <span class="top-emoji" id="topEmoji"></span>
                        <div class="top-details">
                            <span class="top-label" id="topLabel"></span>
                            <span class="top-confidence" id="topConfidence"></span>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <!-- All class probabilities -->
                    <div class="all-predictions" id="allPredictions"></div>

                    <!-- Interpret button -->
                    <button class="interpret-btn" id="interpretBtn" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        Show Interpretability
                    </button>
                </div>
            </div>

            <!-- Reset button -->
            <button class="reset-btn" id="resetBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
                Try Another Image
            </button>

            <!-- Heatmap card (Captum GradCAM) -->
            <div class="heatmap-card" id="heatmapCard" style="display: none;">
                <h3 class="heatmap-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    GradCAM Attribution
                </h3>
                <p class="heatmap-subtitle">Regions that influenced the prediction</p>
                <div class="heatmap-loading" id="heatmapLoading">
                    <div class="spinner"></div>
                    <p>Generating heatmap...</p>
                </div>
                <img class="heatmap-image" id="heatmapImage" alt="GradCAM heatmap" />
            </div>
        </div>

        <!-- ============ ERROR TOAST ============ -->
        <div class="toast" id="errorToast">
            <span class="toast-icon">⚠️</span>
            <span class="toast-message" id="toastMessage"></span>
        </div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
